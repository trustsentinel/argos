version: 2
updates:
  - package-ecosystem: pip
    directories: ["/argos-explorer", "/argos-consumers/btc-processer", "/argos-consumers/sample-processer"]
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # keep the client on 8.x to match the Elasticsearch 8.15 server;
      # revisit together with a server upgrade
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/argos-explorer", "/argos-consumers/btc-processer", "/argos-consumers/sample-processer", "/infra/test"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
